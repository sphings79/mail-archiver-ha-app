name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Add-on configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./amberchest"

  version:
    name: Version matches the published image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The image tag has to exist
        run: |
          version=$(grep '^version:' amberchest/config.yaml | cut -d'"' -f2)
          echo "Add-on version: $version"
          curl -sf "https://ghcr.io/token?scope=repository%3Asphings79%2Famberchest%3Apull&service=ghcr.io" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])" > /tmp/token
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $(cat /tmp/token)" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/sphings79/amberchest/manifests/$version")
          echo "Manifest request returned $status"
          test "$status" = "200"
