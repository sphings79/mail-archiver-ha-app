<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="AmberChest as a Home Assistant add-on">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41BDF5"/>
      <stop offset="1" stop-color="#7C7CF5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="16" fill="#0f1720"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
