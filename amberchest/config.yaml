name: AmberChest
version: "2.1.0"
slug: amberchest
description: Back up IMAP mailboxes to plain .eml files you own - read only, incremental, nothing deleted on the server.
url: https://github.com/sphings79/amberchest-ha-app
# The multi-arch image the AmberChest release workflow publishes; the
# supervisor appends the version above as the tag.
image: ghcr.io/sphings79/amberchest
arch:
  - aarch64
  - amd64
init: false
# The interface appears in the sidebar. Home Assistant authenticates the user
# before the request arrives, so the add-on runs without a login of its own.
ingress: true
ingress_port: 8484
panel_icon: mdi:email-sync-outline
panel_title: AmberChest
# Only needed to reach the interface from outside Home Assistant, which also
# requires an interface password below.
ports:
  8484/tcp: null
ports_description:
  8484/tcp: Web interface, only with an interface password set - see the Documentation tab
map:
  - type: share
    read_only: false
  - type: backup
    read_only: false
  - type: media
    read_only: false
options:
  master_password: ""
  ui_password: ""
  cron: ""
  cron_export_attachments: false
  archive_path: /share/mail-archive
  log_level: info
schema:
  master_password: password
  ui_password: password?
  cron: str?
  cron_export_attachments: bool
  archive_path: str
  log_level: list(debug|info|warn|error)
