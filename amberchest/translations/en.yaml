configuration:
  master_password:
    name: Master password
    description: >-
      Encrypts every mailbox password AmberChest stores. Choose one now and
      keep it: without it the configuration cannot be opened again.
  ui_password:
    name: Interface password
    description: >-
      Only needed to reach the interface from outside Home Assistant, for a
      browser elsewhere or to move an archive over from the desktop app. Leave
      it empty and the add-on answers the sidebar and nothing else. The
      Documentation tab walks through it with pictures.
  cron:
    name: Schedule
    description: >-
      Cron expression for the automatic backup, for example "0 3 * * *" for
      every night at three. Empty means no schedule.
  cron_export_attachments:
    name: Export attachments on every scheduled run
    description: >-
      Runs the attachment export after each scheduled backup, using the
      settings of each account.
  archive_path:
    name: Archive folder
    description: >-
      Where the .eml files are written. Must be below /share, /media or
      /backup, otherwise it is lost on the next update.
  log_level:
    name: Log level
    description: How much the add-on writes to its log.
network:
  8484/tcp: >-
    Web interface. Needs an interface password above, otherwise the add-on
    goes on refusing everything that is not Home Assistant itself. See the
    Documentation tab.
